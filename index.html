<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="森と庭園、海沿いの崖を巡る3D散策。">
  <title>青羽公園</title>
  <link rel="preload" href="assets/fonts/title.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="park.css?v=5">
</head>
<body>
  <canvas id="scene" aria-label="青羽公園の3D風景"></canvas>
  <canvas id="hdr-scene" aria-hidden="true" hidden></canvas>
  <main>
    <div id="title-screen">
      <button id="start" type="button" disabled>
        <span class="title">青羽公園</span>
        <span id="start-state">読み込み中</span>
      </button>
    </div>
    <p id="exploration-place" role="status" hidden></p>
    <section id="graphics" aria-labelledby="graphics-title" hidden>
      <header>
        <div><h1 id="graphics-title">画質設定</h1><p id="render-status"></p></div>
        <button id="close-graphics" type="button" aria-label="設定を閉じる">×</button>
      </header>
      <form id="options">
        <fieldset>
          <legend>表示解像度</legend>
          <div class="segments">
            <label><input type="radio" name="resolution" value="auto" checked><span>自動</span></label>
            <label><input type="radio" name="resolution" value="1.5k"><span>1.5K</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>フレームレート上限</legend>
          <div class="segments">
            <label><input type="radio" name="fps" value="60" checked><span>60 FPS</span></label>
            <label><input type="radio" name="fps" value="120"><span>120 FPS</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>影</legend>
          <div class="segments">
            <label><input type="radio" name="shadows" value="standard" checked><span>標準</span></label>
            <label><input type="radio" name="shadows" value="super"><span>スーパー影</span></label>
          </div>
        </fieldset>
        <label class="hdr-row">
          <span>HDR <small id="hdr-status"></small></span>
          <input type="checkbox" name="hdr" role="switch" aria-describedby="hdr-status">
        </label>
      </form>
      <p id="draw-mode"></p>
    </section>
  </main>
  <script type="module" src="park.js?v=4"></script>
</body>
</html>
